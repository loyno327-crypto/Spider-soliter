name: Build Spider Solitaire APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project ZIP
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o spider-solitaire-project.zip -d extracted
          echo "Project extracted:"
          find extracted -maxdepth 3 -type f | head -50

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: extracted
        run: npm install

      - name: Add Android
        working-directory: extracted
        run: npx cap add android

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Sync Capacitor
        working-directory: extracted
        run: npx cap sync android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: extracted/android
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spider-Solitaire-APK
          path: extracted/android/app/build/outputs/apk/debug/app-debug.apk
